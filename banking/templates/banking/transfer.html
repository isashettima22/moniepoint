{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Transfer</title>

    <link rel="stylesheet" href="{% static 'banking/style.css' %}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1>Moniepoint</h1>

        <h2>Money Transfer</h2>

        <p>Available Demo Balance</p>

        <h2>₦{{ balance|floatformat:2 }}</h2>

        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Review Transfer
            </button>

        </form>

        <p>
            <a href="{% url 'dashboard' %}">
                Back to Dashboard
            </a>
        </p>

    </div>

</body>
</html>
