{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Water Bill | Moniepoint</title>
    <link rel="stylesheet" href="{% static 'banking/style.css' %}">
</head>
<body>

    <div class="airtime-card">
        <h2>Review Water Bill Payment</h2>

        <p><strong>Provider:</strong> {{ details.provider }}</p>
        <p><strong>Customer Account Number:</strong> {{ details.customer_number }}</p>
        <p><strong>Amount:</strong> ₦{{ details.amount }}</p>

        <p>Please confirm that these details are correct.</p>

        <form method="POST" action="{% url 'confirm_water' %}">
            {% csrf_token %}
            <button type="submit">Confirm Payment</button>
        </form>

        <br>
        <a href="{% url 'water_bill' %}">Cancel Payment</a>
    </div>

</body>
</html>
