{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Profile | Moniepoint</title>

    <link rel="stylesheet" href="{% static 'banking/style.css' %}">
</head>

<body>

    <div class="airtime-card">

        <h2>Update My Profile</h2>

        <p>Change your email address below.</p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Save Changes</button>
        </form>

        <br>

        <a href="{% url 'profile' %}">Back to Profile</a>

    </div>

</body>
</html>
