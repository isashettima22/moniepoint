{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Subscription | Moniepoint</title>
    <link rel="stylesheet" href="{% static 'banking/style.css' %}">
</head>
<body>

    <div class="airtime-card">
        <h2>TV Subscription</h2>

        <p>Available Wallet Balance:</p>
        <h3>₦{{ balance|floatformat:2 }}</h3>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Review Subscription</button>
        </form>

        <br>
        <a href="{% url 'dashboard' %}">Back to Dashboard</a>
    </div>

</body>
</html>
